*{

}

body{

}

.app{

  flex-direction:column;
}

/* HEADER */

.header{
  padding:20px;
  background:#111820;
  color:#fff;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{

  font-weight:800;
}

.ai{

.subtitle{

  color:#aeb8c2;
}

.online{
  margin-top:13px;

}

/* CHAT */

.chat{
  flex:1;
  padding:18px;
  overflow-y:auto;
  min-height:500px;
}

.message{
  max-width:86%;
  margin:10px 0;
  padding:13px 15px;
  border-radius:17px;
  font-size:14px;
  line-height:1.5;
}

.bot{
  background:#f0f3f5;
  border-bottom-left-radius:5px;
}

.user{
  margin-left:auto;
  background:#111820;
  color:white;
  border-bottom-right-radius:5px;
}

/* QUICK ACTIONS */

.quick{
  display:flex;
  gap:8px;
  padding:10px 16px;
  overflow-x:auto;
  border-top:1px solid #edf0f2;
}

.quick button{
  white-space:nowrap;
  border:1px solid #d8dee4;
  background:white;
  border-radius:22px;
  padding:10px 13px;
  font-size:12px;
  cursor:pointer;
}

/* INPUT */

.input{
  display:flex;
  gap:8px;
  padding:12px 16px 18px;
  border-top:1px solid #e6e9ec;
}

.input input{
  flex:1;
  padding:14px;
  border:1px solid #d5dce2;
  border-radius:14px;
  outline:none;
  font-size:14px;
}

.send{
  border:0;
  background:#111820;
  color:#fff;
  border-radius:14px;
  padding:0 17px;
  font-weight:bold;
  cursor:pointer;
}

.card-info{

  line-height:1.6;
}
